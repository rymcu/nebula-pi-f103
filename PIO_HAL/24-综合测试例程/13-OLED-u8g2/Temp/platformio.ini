; https://docs.platformio.org/page/projectconf.html

[env:rymcu_nebulapi_f103ve]
platform = ststm32
board = rymcu_nebulapi_f103ve
framework = stm32cube
debug_tool = cmsis-dap
upload_protocol = cmsis-dap
build_flags = 
	-Wl,-u,_printf_float
lib_deps = olikraus/U8g2@^2.36.5

[platformio]
src_dir = Core/Src
include_dir = Core/Inc
